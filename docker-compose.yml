    depends_on:
      batch-postgres:
        condition: service_healthy
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["3"]       # 分配 GPU 3
              capabilities: [gpu]

  # ============================================================
  # DINOv3 Workers (GPU 4-7) - 变化检测推理（替代 DreamSim）
  # 使用 DINOv3 Vision Transformer 进行变化检测
  # 每个容器绑定一张 GPU，内部由 Launcher 启动 3 个 Worker 进程
  # ============================================================
  dinov3-worker-0:
