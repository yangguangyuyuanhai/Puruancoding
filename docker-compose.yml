    volumes:
      - /data/batch_shared:/data/batch_shared
    depends_on:
      batch-postgres:
        condition: service_healthy
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["5"]
              capabilities: [gpu]

  ds-worker-2:
    build:
      context: .
      dockerfile: worker/Dockerfile.dreamsim
    container_name: ds-worker-2
    restart: unless-stopped
    command: ["--gpu-id", "6", "--model-type", "dreamsim", "--initial-workers", "3"]
    environment:
      - BATCH_PG_HOST=batch-postgres
      - BATCH_PG_PORT=5432
      - BATCH_PG_DB=batch_detection
      - BATCH_PG_USER=batch
      - BATCH_PG_PASS=batch_secret
      - BATCH_SHARED_ROOT=/data/batch_shared
      - NVIDIA_VISIBLE_DEVICES=6
    volumes:
      - /data/batch_shared:/data/batch_shared
    depends_on:
      batch-postgres:
        condition: service_healthy
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["6"]
              capabilities: [gpu]

  ds-worker-3:
    build:
      context: .
      dockerfile: worker/Dockerfile.dreamsim
    container_name: ds-worker-3
    restart: unless-stopped
