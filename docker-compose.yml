# ============================================================
# 违章建筑检测系统 - 批量推理平台 Docker Compose
# ============================================================
# 本文件定义系统的容器编排：
#   - batch-postgres: PostgreSQL 15 数据库 (独立实例, 端口 5433, 避开现有 5432)
#   - sam3-worker-0~3: SAM3 分割检测 Worker (分别绑定 GPU 0-3)
#   - dinov3-worker-0~3: DINOv3 变化检测 Worker (分别绑定 GPU 4-7)
# 所有 Worker 依赖 batch-postgres 健康后才启动
# 所有容器共享 /data/batch_shared 卷进行 IPC 通信
# ============================================================

services:
  # ============================================================
  # PostgreSQL 数据库 - 任务状态持久化
  # ============================================================
  batch-postgres:
    image: postgres:15-alpine       # 使用轻量 Alpine 版本
    container_name: batch-postgres
    restart: unless-stopped         # 异常退出自动重启（手动 stop 除外）
    environment:
      POSTGRES_DB: batch_detection    # 自动创建的数据库名
      POSTGRES_USER: batch            # 数据库用户名
      POSTGRES_PASSWORD: batch_secret # 数据库密码
    ports:
      - "5433:5432"                 # 端口映射: 宿主机 5433 → 容器 5432
                                    # 使用 5433 而非 5432 是因为宿主机可能已有其他 PG 实例占用 5432
                                    # Gateway (宿主机) 连接时用 5433，Worker (Docker 网络内) 连接时用 5432
    volumes:
      # 数据持久化：PG 数据文件存储到宿主机目录
      - /data/batch_shared/pgdata:/var/lib/postgresql/data
      # 初始化脚本：PG 首次启动时自动执行建表 SQL
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      # 健康检查：Worker 容器等待 PG 就绪后才启动
      test: ["CMD-SHELL", "pg_isready -U batch -d batch_detection"]
      interval: 5s    # 每 5 秒检查一次
      timeout: 5s     # 超时时间
      retries: 5      # 最多重试 5 次

  # ============================================================
  # SAM3 Workers (GPU 0-3) - 分割检测推理
  # 每个容器绑定一张 GPU，内部由 Launcher 启动 3 个 Worker 进程
  # ============================================================
  sam3-worker-0:
    build:
      context: .                          # 构建上下文为项目根目录
      dockerfile: worker/Dockerfile.sam3  # 基于 sam3-sam3:latest 扩展
    container_name: sam3-worker-0
    restart: unless-stopped
    # 传给 launcher.py 的命令行参数：GPU 编号、模型类型、初始 Worker 数
    command: ["--gpu-id", "0", "--model-type", "sam3", "--initial-workers", "3"]
    environment:
      - BATCH_PG_HOST=batch-postgres  # 容器间通过服务名访问 PG
      - BATCH_PG_PORT=5432            # 容器内部使用 PG 原始端口
      - BATCH_PG_DB=batch_detection
      - BATCH_PG_USER=batch
      - BATCH_PG_PASS=batch_secret
      - BATCH_SHARED_ROOT=/data/batch_shared  # 共享卷路径
      - NVIDIA_VISIBLE_DEVICES=0              # 限制只能看到 GPU 0
    volumes:
      # 挂载共享卷：心跳、任务文件、结果文件、伸缩指令
      - /data/batch_shared:/data/batch_shared
    depends_on:
      batch-postgres:
        condition: service_healthy  # 等待 PG 健康检查通过后才启动
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["0"]       # 分配 GPU 0
              capabilities: [gpu]

  sam3-worker-1:
    build:
      context: .
      dockerfile: worker/Dockerfile.sam3
    container_name: sam3-worker-1
    restart: unless-stopped
    command: ["--gpu-id", "1", "--model-type", "sam3", "--initial-workers", "3"]
    environment:
      - BATCH_PG_HOST=batch-postgres
      - BATCH_PG_PORT=5432
      - BATCH_PG_DB=batch_detection
      - BATCH_PG_USER=batch
      - BATCH_PG_PASS=batch_secret
      - BATCH_SHARED_ROOT=/data/batch_shared
      - NVIDIA_VISIBLE_DEVICES=1
    volumes:
      - /data/batch_shared:/data/batch_shared
    depends_on:
      batch-postgres:
        condition: service_healthy
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["1"]       # 分配 GPU 1
              capabilities: [gpu]

  sam3-worker-2:
